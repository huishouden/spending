name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # README screenshots, PR evidence branch, the hosting release asset
      id-token: write
      pull-requests: write # before/after comment on PRs
    with:
      base: /spending/
      staging-ref: ${{ inputs.staging-ref }}

  release:
    uses: huishouden/pwa-kit/.github/workflows/release.yml@v0
    permissions:
      contents: write
      pull-requests: write
